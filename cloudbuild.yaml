# Google Cloud Build & Cloud Run automated deployment configuration
steps:
  # 1. Build backend container image from ./backend
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/set-detector-api:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/set-detector-api:latest"
      - "./backend"

  # 2. Push container image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/set-detector-api:$COMMIT_SHA"

  # 3. Deploy to Google Cloud Run with 2Gi RAM & 2 vCPU for full-precision YOLO inference
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "set-detector-api"
      - "--image"
      - "gcr.io/$PROJECT_ID/set-detector-api:$COMMIT_SHA"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--memory"
      - "2Gi"
      - "--cpu"
      - "2"
      - "--port"
      - "8000"
      - "--allow-unauthenticated"

substitutions:
  _REGION: "asia-northeast3"

images:
  - "gcr.io/$PROJECT_ID/set-detector-api:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/set-detector-api:latest"
