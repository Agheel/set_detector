services:
  set-detector-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: set-detector-api
    ports:
      - "8000:7860"
    volumes:
      - ./backend/weights:/app/weights:ro
    environment:
      - PORT=7860
      - SET_YOLO_WEIGHTS=${SET_YOLO_WEIGHTS:-}
    restart: unless-stopped
